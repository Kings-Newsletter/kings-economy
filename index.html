<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

      name="description"
      content="King's Economy: os indicadores econômicos do Brasil explicados em linguagem direta, com calculadoras para testar o efeito no seu orçamento."
    />
    <meta name="theme-color" content="#FBFCFB" media="(prefers-color-scheme: light)" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

      } catch (e) {}
    </script>
  </head>
